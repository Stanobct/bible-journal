<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>
window.onerror = function (msg, src, ligne, col) {
  var b = document.createElement("div");
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#b00020;color:#fff;padding:12px;font:14px sans-serif";
  b.textContent = "Erreur ligne " + ligne + " (col. " + col + ") : " + msg + "  (touche pour fermer)";
  b.onclick = function () { b.remove(); };
  (document.body || document.documentElement).appendChild(b);
};
window.addEventListener("unhandledrejection", function (e) {
  window.onerror("Erreur : " + (e.reason && e.reason.message ? e.reason.message : e.reason), "", 0, 0);
});
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a5c3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bible journal</title>
<style>
:root{--fond:#faf6ef;--carte:#fff;--texte:#2b2420;--doux:#7d7068;--accent:#7a5c3e;--accent2:#c08d5e;--bord:#e6dccf;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--fond:#1c1916;--carte:#27221e;--texte:#eee6dc;--doux:#a89c90;--accent:#d2a679;--accent2:#e0b48a;--bord:#3a332c}}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:17px/1.55 -apple-system,system-ui,sans-serif;padding-bottom:90px}
.entete{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--fond);border-bottom:1px solid var(--bord)}
.entete h1{font-size:19px;margin:0;font-family:Georgia,serif;color:var(--accent)}
.sos{background:var(--danger);color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:700;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.onglets{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--carte);border-top:1px solid var(--bord);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.onglets button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--doux);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.onglets button span{font-size:22px}
.onglets button.actif{color:var(--accent);font-weight:700}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px 16px;margin:12px 0}
h2{font-family:Georgia,serif;font-size:21px;margin:22px 0 8px;color:var(--accent)}
h3{font-size:17px;margin:12px 0 6px}
.doux{color:var(--doux);font-size:14px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:4px 4px 4px 0;font-size:16px}
.btn.secondaire{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:var(--danger)}
.btn.petit{padding:6px 10px;font-size:14px}
.rangee{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);margin:4px 0}
select{width:auto;max-width:100%}
textarea{min-height:80px}
label{display:flex;align-items:center}
.puce{border:1px solid var(--bord);background:var(--fond);color:var(--texte);border-radius:20px;padding:6px 12px;font-size:15px}
.puce.choisie{background:var(--accent);color:#fff;border-color:var(--accent)}
.texte-bible{font-family:Georgia,serif;font-size:19px;line-height:1.7}
.lecture-texte{font-family:Georgia,serif}
.verset{border-radius:4px}
.verset sup{color:var(--doux);font-size:12px;margin-right:3px}
.verset.choisi{outline:2px dashed var(--accent)}
.c-jaune{background:#fff2a8}.c-vert{background:#cdeccf}.c-bleu{background:#cfe3f7}.c-rose{background:#f8d3e0}
@media (prefers-color-scheme:dark){.c-jaune{background:#5c5320}.c-vert{background:#2c4d2e}.c-bleu{background:#23405c}.c-rose{background:#5a2c3c}}
.pastille{width:34px;height:34px;border-radius:50%;border:1px solid var(--bord)}
.modale{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow-y:auto;padding:20px 12px}
.boite{background:var(--carte);max-width:600px;margin:0 auto 40px;border-radius:16px;padding:18px;position:relative}
.fermer{position:absolute;top:10px;right:10px}
.grand{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.souffle{width:140px;height:140px;margin:16px auto;border-radius:50%;background:var(--accent2);opacity:.8;transform:scale(.5);transition:transform 4s ease-in-out}
.souffle.inspire{transform:scale(1)}
.barre{height:10px;background:var(--bord);border-radius:5px;overflow:hidden;margin:2px 0 8px}
.barre i{display:block;height:100%;background:var(--accent2)}
.centre{text-align:center}
.couvre-feu{position:fixed;inset:0;z-index:40;background:#14110f;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.pied{text-align:center;color:var(--doux);font-size:12px;margin:30px 0}
.perles{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.perles i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.perles i.faite{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:15px}
details summary{font-weight:600;cursor:pointer}
ul{padding-left:20px}
[hidden]{display:none!important}
</style>

<body>
<div id="couvre-feu" hidden></div>

<div id="modale" class="modale" hidden></div>
<script>
"use strict";

/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
function el(tag, props, ...enfants) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null) continue;
      if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k in e) e[k] = v;
      else e.setAttribute(k, v);
    }
  }
  for (const c of enfants.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : String(c));
  }
  return e;
}
function bouton(texte, action, classes) {
  return el("button", { type: "button", className: "btn " + (classes || ""), onclick: action }, texte);
}
function puce(texte, choisie, action) {
  const b = el("button", { type: "button", className: "puce" + (choisie ? " choisie" : "") }, texte);
  b.onclick = () => { b.classList.toggle("choisie"); if (action) action(b.classList.contains("choisie")); };
  return b;
}
function groupePuces(options, choisies) {
  return el("div", { className: "rangee" }, options.map(o => puce(o, choisies.has(o), on => { if (on) choisies.add(o); else choisies.delete(o); })));
}
function liste(x) { return Array.isArray(x) ? x : (x == null || x === "" ? [] : [x]); }
function toast(msg) {
  const t = el("div", { className: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
async function copier(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copi\u00e9 \u2714"); }
  catch (e) { prompt("Copie ce texte :", txt); }
}
async function partager(titre, txt) {
  if (navigator.share) {
    try { await navigator.share({ title: titre, text: txt }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  copier(txt);
}
async function hacher(txt) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(txt)));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
function nettoyerHTML(html) {
  const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
  const sortie = document.createDocumentFragment();
  const OK = ["P", "BR", "EM", "I", "STRONG", "B", "SUP"];
  function copie(n, parent) {
    for (const c of Array.from(n.childNodes)) {
      if (c.nodeType === 3) parent.append(c.textContent);
      else if (c.nodeType === 1) {
        if (OK.includes(c.tagName)) { const e = document.createElement(c.tagName.toLowerCase()); copie(c, e); parent.append(e); }
        else copie(c, parent);
      }
    }
  }
  if (doc.body.firstChild) copie(doc.body.firstChild, sortie);
  return sortie;
}

/* ---------- Dates ---------- */
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "f\u00e9vrier", "mars", "avril", "mai", "juin", "juillet", "ao\u00fbt", "septembre", "octobre", "novembre", "d\u00e9cembre"];
function iso(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function decaler(jour, n) { const [a, m, j] = jour.split("-").map(Number); return iso(new Date(a, m - 1, j + n)); }
function dateLongue(jour) {
  const [a, m, j] = jour.split("-").map(Number);
  const s = JOURS[new Date(a, m - 1, j).getDay()] + " " + j + " " + MOIS[m - 1] + " " + a;
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function joursEntre(debut, fin) { return Math.max(0, Math.floor((fin - debut) / 86400000)); }

/* ---------- Preferences ---------- */
const prefs = { zone: "france", couvreFeu: true, taille: 19 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("bj-prefs") || "{}")); } catch (e) {}
function sauverPrefs() { try { localStorage.setItem("bj-prefs", JSON.stringify(prefs)); } catch (e) {} }

/* ---------- IndexedDB ---------- */
const NOM_BASE = "bible-journal-52";
let promesseBase = null;
function base() {
  if (!promesseBase) promesseBase = new Promise((ok, ko) => {
    const r = indexedDB.open(NOM_BASE, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
  return promesseBase;
}
async function lire(cle) {
  const db = await base();
  return new Promise((ok, ko) => { const r = db.transaction("kv").objectStore("kv").get(cle); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
}
async function ecrire(cle, val) {
  const db = await base();
  return new Promise((ok, ko) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(val, cle); t.oncomplete = () => ok(); t.onerror = () => ko(t.error); });
}
async function chercherAncienJournal() {
  if (!indexedDB.databases) return null;
  let bases = [];
  try { bases = await indexedDB.databases(); } catch (e) { return null; }
  for (const info of bases) {
    if (!info.name || info.name === NOM_BASE) continue;
    try {
      const db = await new Promise((ok, ko) => { const r = indexedDB.open(info.name); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      for (const store of Array.from(db.objectStoreNames)) {
        const val = await new Promise(ok => {
          try { const r = db.transaction(store).objectStore(store).get("journal"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }
          catch (e) { ok(null); }
        });
        if (val && typeof val === "object" && (val.entrees || val.surlignages || val.combat)) { db.close(); return val; }
      }
      db.close();
    } catch (e) {}
  }
  return null;
}

/* ---------- Etat ---------- */
function etatVide() {
  return {
    surlignages: {}, entrees: [],
    combat: { debut: Date.now(), record: 0, chutes: [], tentations: [] },
    rituels: {},
    reglages: { lettre: "", contacts: [{ nom: "", tel: "" }, { nom: "", tel: "" }], pin: "" }
  };
}
function completer(e) {
  const v = etatVide();
  if (!e || typeof e !== "object") return v;
  if (!e.surlignages || typeof e.surlignages !== "object" || Array.isArray(e.surlignages)) e.surlignages = {};
  e.entrees = liste(e.entrees).filter(x => x && typeof x === "object");
  if (!e.combat || typeof e.combat !== "object") e.combat = v.combat;
  const d = new Date(e.combat.debut).getTime();
  e.combat.debut = isNaN(d) ? Date.now() : d;
  e.combat.record = Number(e.combat.record) || 0;
  e.combat.chutes = liste(e.combat.chutes).map(c => c && typeof c === "object" ? c : { quand: new Date(c).getTime() || 0 });
  e.combat.tentations = liste(e.combat.tentations || e.combat.notes).filter(x => x && typeof x === "object");
  for (const t of e.combat.tentations) { const q = new Date(t.quand || t.date || 0).getTime(); t.quand = isNaN(q) ? 0 : q; }
  if (!e.rituels || typeof e.rituels !== "object") e.rituels = {};
  if (!e.reglages || typeof e.reglages !== "object") e.reglages = v.reglages;
  const R = e.reglages;
  if (!R.pin && R.pinHash) R.pin = R.pinHash;
  R.pin = typeof R.pin === "string" ? R.pin : "";
  R.lettre = typeof R.lettre === "string" ? R.lettre : "";
  R.contacts = liste(R.contacts).map(c => c && typeof c === "object"
    ? { nom: String(c.nom || c.name || ""), tel: String(c.tel || c.telephone || c.numero || "") }
    : { nom: "", tel: String(c || "") });
  while (R.contacts.length < 2) R.contacts.push({ nom: "", tel: "" });
  return e;
}
let etat = etatVide();
let minuteurSauvegarde = null;
function sauver() {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(() => { ecrire("journal", etat).catch(e => toast("Sauvegarde impossible : " + e.message)); }, 300);
}

/* ---------- Prieres ---------- */
const NOTRE_PERE = "Notre P\u00e8re, qui es aux cieux, que ton nom soit sanctifi\u00e9, que ton r\u00e8gne vienne, que ta volont\u00e9 soit faite sur la terre comme au ciel. Donne-nous aujourd'hui notre pain de ce jour. Pardonne-nous nos offenses, comme nous pardonnons aussi \u00e0 ceux qui nous ont offens\u00e9s. Et ne nous laisse pas entrer en tentation, mais d\u00e9livre-nous du Mal. Amen.";
const AVE = "Je vous salue, Marie, pleine de gr\u00e2ce ; le Seigneur est avec vous. Vous \u00eates b\u00e9nie entre toutes les femmes, et J\u00e9sus, le fruit de vos entrailles, est b\u00e9ni. Sainte Marie, M\u00e8re de Dieu, priez pour nous, pauvres p\u00e9cheurs, maintenant et \u00e0 l'heure de notre mort. Amen.";
const GLOIRE = "Gloire au P\u00e8re, et au Fils, et au Saint-Esprit, comme il \u00e9tait au commencement, maintenant et toujours, et dans les si\u00e8cles des si\u00e8cles. Amen.";
const SAINT_MICHEL = "Saint Michel Archange, d\u00e9fendez-nous dans le combat ; soyez notre secours contre la malice et les emb\u00fbches du d\u00e9mon. Que Dieu lui commande, nous vous en supplions ; et vous, Prince de la milice c\u00e9leste, par la force divine, repoussez en enfer Satan et les autres esprits mauvais qui r\u00f4dent dans le monde pour la perte des \u00e2mes. Amen.";
const ACTE_CONTRITION = "Mon Dieu, j'ai un tr\u00e8s grand regret de vous avoir offens\u00e9, parce que vous \u00eates infiniment bon, infiniment aimable, et que le p\u00e9ch\u00e9 vous d\u00e9pla\u00eet. Je prends la ferme r\u00e9solution, avec le secours de votre sainte gr\u00e2ce, de ne plus vous offenser et de faire p\u00e9nitence. Amen.";
const OFFRANDE = "C\u0153ur divin de J\u00e9sus, je vous offre, par le C\u0153ur immacul\u00e9 de Marie, les pri\u00e8res, les \u0153uvres et les souffrances de cette journ\u00e9e, en r\u00e9paration de nos offenses et \u00e0 toutes les intentions pour lesquelles vous vous immolez continuellement sur l'autel. Je vous les offre en particulier pour les intentions du Saint-P\u00e8re. Amen.";

/* ---------- Livres : [nom, abreviations, noms anglais] ---------- */
const LIVRES = [
  ["Gen\u00e8se", "gn,gen", "genesis"], ["Exode", "ex,exo", "exodus"], ["L\u00e9vitique", "lv,lev", "leviticus"],
  ["Nombres", "nb,nom", "numbers"], ["Deut\u00e9ronome", "dt,deut", "deuteronomy"], ["Josu\u00e9", "jos", "joshua"],
  ["Juges", "jg,jug", "judges"], ["Ruth", "rt,ru", "ruth"], ["1 Samuel", "1s,1sam", "1samuel"],
  ["2 Samuel", "2s,2sam", "2samuel"], ["1 Rois", "1r,1ro", "1kings"], ["2 Rois", "2r,2ro", "2kings"],
  ["1 Chroniques", "1ch,1chr", "1chronicles"], ["2 Chroniques", "2ch,2chr", "2chronicles"], ["Esdras", "esd", "ezra"],
  ["N\u00e9h\u00e9mie", "ne,neh", "nehemiah"], ["Tobie", "tb,tob", "tobit,tobias"], ["Judith", "jdt", "judith"],
  ["Esther", "est", "esther"], ["1 Maccab\u00e9es", "1m,1mac", "1maccabees"], ["2 Maccab\u00e9es", "2m,2mac", "2maccabees"],
  ["Job", "jb", "job"], ["Psaumes", "ps", "psalms,psalm"], ["Proverbes", "pr,prov", "proverbs"],
  ["Eccl\u00e9siaste", "qo,qoh,ecc,qohelet", "ecclesiastes"], ["Cantique des cantiques", "ct,cant,cantique", "songofsolomon,songofsongs,canticles"],
  ["Sagesse", "sg,sag", "wisdom,wisdomofsolomon"], ["Eccl\u00e9siastique", "si,sir,siracide", "sirach,ecclesiasticus"],
  ["Isa\u00efe", "is", "isaiah"], ["J\u00e9r\u00e9mie", "jr,jer", "jeremiah"], ["Lamentations", "lm,lam", "lamentations"],
  ["Baruch", "ba,bar", "baruch"], ["\u00c9z\u00e9chiel", "ez,ezk", "ezekiel"], ["Daniel", "dn,dan", "daniel"],
  ["Os\u00e9e", "os", "hosea"], ["Jo\u00ebl", "jl", "joel"], ["Amos", "am", "amos"], ["Abdias", "ab,abd", "obadiah"],
  ["Jonas", "jon", "jonah"], ["Mich\u00e9e", "mi", "micah"], ["Nahum", "na", "nahum"], ["Habacuc", "ha,hab", "habakkuk"],
  ["Sophonie", "so,soph", "zephaniah"], ["Agg\u00e9e", "ag", "haggai"], ["Zacharie", "za,zac", "zechariah"],
  ["Malachie", "ml,mal", "malachi"], ["Matthieu", "mt", "matthew"], ["Marc", "mc", "mark"], ["Luc", "lc", "luke"],
  ["Jean", "jn", "john"], ["Actes des Ap\u00f4tres", "ac,act,actes", "acts,actsoftheapostles"], ["Romains", "rm,rom", "romans"],
  ["1 Corinthiens", "1co,1cor", "1corinthians"], ["2 Corinthiens", "2co,2cor", "2corinthians"], ["Galates", "ga,gal", "galatians"],
  ["\u00c9ph\u00e9siens", "ep,eph", "ephesians"], ["Philippiens", "ph,phil", "philippians"], ["Colossiens", "col", "colossians"],
  ["1 Thessaloniciens", "1th", "1thessalonians"], ["2 Thessaloniciens", "2th", "2thessalonians"],
  ["1 Timoth\u00e9e", "1tm,1tim", "1timothy"], ["2 Timoth\u00e9e", "2tm,2tim", "2timothy"], ["Tite", "tt,tit", "titus"],
  ["Phil\u00e9mon", "phm", "philemon"], ["H\u00e9breux", "he,heb", "hebrews"], ["Jacques", "jc,jac", "james"],
  ["1 Pierre", "1p,1pi", "1peter"], ["2 Pierre", "2p,2pi", "2peter"], ["1 Jean", "1jn", "1john"],
  ["2 Jean", "2jn", "2john"], ["3 Jean", "3jn", "3john"], ["Jude", "jude", "jude"],
  ["Apocalypse", "ap,apoc", "revelation,revelationofjohn"]
];
function cleNom(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim()
    .replace(/^(iii|ii|i)\s+/, m => ({ iii: "3", ii: "2", i: "1" })[m.trim()])
    .replace(/[^a-z0-9]/g, "");
}
const INDEX_LIVRES = {};
LIVRES.forEach((l, i) => {
  [l[0]].concat(l[1].split(","), l[2].split(",")).forEach(k => { if (k) INDEX_LIVRES[cleNom(k)] = i; });
});
const VERSETS_FORCE = ["1 Corinthiens|10|13", "Philippiens|4|13", "Romains|8|1", "2 Corinthiens|12|9", "Hebreux|4|15",
  "Hebreux|4|16", "Jacques|4|7", "Galates|5|1", "Jean|8|36", "1 Jean|1|9", "Romains|12|21", "Matthieu|11|28",
  "Isaie|41|10", "Jean|16|33", "1 Pierre|5|7", "Romains|5|20", "Matthieu|5|8", "Ezechiel|36|26", "2 Timothee|1|7",

/* ---------- Bible Crampon ---------- */
let BIBLE = null;
let promesseBible = null;
const SOURCES_BIBLE = [
  "crampon.json",
  "https://raw.githubusercontent.com/scrollmapper/bible_databases/master/formats/json/FreCrampon.json",
  "https://cdn.jsdelivr.net/gh/scrollmapper/bible_databases@master/formats/json/FreCrampon.json",
  "https://raw.githubusercontent.com/scrollmapper/bible_databases/master/json/FreCrampon.json"
];
function analyserBible(json) {
  const bruts = Array.isArray(json) ? json : (json.books || json.Books || []);
  const livres = [];
  for (const b of bruts) {
    if (!b) continue;
    const nomBrut = String(b.name || b.book || b.title || b.abbrev || "");
    const idx = INDEX_LIVRES[cleNom(nomBrut)];
    const chapitres = liste(b.chapters).map((c, ci) => {
      if (Array.isArray(c)) return { n: ci + 1, versets: c.map((t, vi) => [vi + 1, String(t).trim()]) };
      return { n: Number(c.chapter || c.number || ci + 1), versets: liste(c.verses).map((v, vi) => typeof v === "string" ? [vi + 1, v.trim()] : [Number(v.verse || v.number || vi + 1), String(v.text || "").trim()]) };
    }).filter(c => c.versets.length);
    if (chapitres.length) livres.push({ idx: idx == null ? 999 : idx, nom: idx == null ? nomBrut : LIVRES[idx][0], chapitres });
  }
  livres.sort((a, b) => a.idx - b.idx);
  return { livres };
}
async function telechargerBible() {
  try { const c = await lire("bible-crampon"); if (c && c.livres && c.livres.length) { BIBLE = c; return c; } } catch (e) {}
  let pb = "";
  for (const url of SOURCES_BIBLE) {
    try {
      const r = await fetch(url);
      if (!r.ok) { pb = "erreur " + r.status; continue; }
      const b = analyserBible(await r.json());
      if (!b.livres.length) { pb = "fichier vide"; continue; }
      BIBLE = b;
      ecrire("bible-crampon", b).catch(() => {});
      return b;
    } catch (e) { pb = e.message; }
  }
  throw new Error(pb || "aucune source");
}
function chargerBible() {
  if (BIBLE) return Promise.resolve(BIBLE);
  if (!promesseBible) promesseBible = telechargerBible().catch(e => { promesseBible = null; throw e; });
  return promesseBible;
}
function trouverLivre(nom) {
  if (!BIBLE) return null;
  const c = cleNom(nom);
  const i = INDEX_LIVRES[c];
  if (i != null) { const l = BIBLE.livres.find(x => x.idx === i); if (l) return l; }
  return BIBLE.livres.find(x => cleNom(x.nom) === c) || null;
}
function chapitre(livre, n) { return livre.chapitres.find(c => c.n === n) || null; }
function texteVerset(nom, c, v) {
  const l = trouverLivre(nom);
  const ch = l && chapitre(l, c);
  const x = ch && ch.versets.find(y => y[0] === v);
  return x ? x[1] : null;
}
function versetHasard() {
  if (!BIBLE) return null;
  for (let i = 0; i < 12; i++) {
    const [l, c, v] = VERSETS_FORCE[Math.floor(Math.random() * VERSETS_FORCE.length)].split("|");
    const t = texteVerset(l, Number(c), Number(v));
    if (t) return { livre: trouverLivre(l).nom, c: Number(c), v: Number(v), texte: t };
  }
  return null;
}
function analyserRef(ref) {
  const s = String(ref || "").replace(/\u00a0/g, " ").replace(/^\s*cf\.?\s*/i, "").trim();
  const m = s.match(/^((?:[1-3]\s*)?[A-Za-z\u00c0-\u00ff][A-Za-z\u00c0-\u00ff'\s]*?)\.?\s*(\d+)\s*(?:$(\d+)$)?\s*(?:[,.:]\s*(\d+))?/);
  if (!m) return null;
  return { livre: m[1].trim(), chapitres: m[3] ? [Number(m[3]), Number(m[2])] : [Number(m[2])], verset: m[4] ? Number(m[4]) : 0 };
}

/* ---------- Lecteur biblique ---------- */
const lecteur = { nom: "", chap: 1, cible: 0 };
if (prefs.lecteur && typeof prefs.lecteur === "object") { lecteur.nom = String(prefs.lecteur.nom || ""); lecteur.chap = Number(prefs.lecteur.chap) || 1; }
function sauverLecteur() { prefs.lecteur = { nom: lecteur.nom, chap: lecteur.chap }; sauverPrefs(); }
function changerTaille(d) { prefs.taille = Math.min(28, Math.max(14, (Number(prefs.taille) || 19) + d)); sauverPrefs(); rendreLecteur(); }
async function allerA(ref) {
  const r = analyserRef(ref);
  if (!r) return "r\u00e9f\u00e9rence illisible";
  try { await chargerBible(); } catch (e) { return "Bible pas encore charg\u00e9e"; }
  const livre = trouverLivre(r.livre);
  if (!livre) return "livre introuvable : " + r.livre;
  for (const c of r.chapitres) {
    if (chapitre(livre, c)) {
      lecteur.nom = livre.nom; lecteur.chap = c; lecteur.cible = r.verset || -1;
      sauverLecteur(); rendreLecteur();
      return "";
    }
  }
  return "chapitre introuvable";
}
function rendreLecteur() {
  const zone = $("p-lecteur");
  if (!zone) return;
  if (!BIBLE) {
    zone.replaceChildren(el("p", { className: "doux" }, "Chargement de la Bible Crampon\u2026 (la premi\u00e8re fois, cela peut prendre une minute)"));
    chargerBible().then(() => rendreLecteur()).catch(e => zone.replaceChildren(
      el("p", { className: "doux" }, "Impossible de charger la Bible : " + e.message),
      bouton("R\u00e9essayer", rendreLecteur, "petit")));
    return;
  }
  const livre = trouverLivre(lecteur.nom) || trouverLivre("Jean") || BIBLE.livres[0];
  const ch = chapitre(livre, lecteur.chap) || livre.chapitres[0];
  lecteur.nom = livre.nom; lecteur.chap = ch.n;
  const iLivre = BIBLE.livres.indexOf(livre);
  const iChap = livre.chapitres.indexOf(ch);
  function aller(li, ci) {
    const l = BIBLE.livres[li]; if (!l) return;
    const c = l.chapitres[ci < 0 ? l.chapitres.length - 1 : ci]; if (!c) return;
    lecteur.nom = l.nom; lecteur.chap = c.n; lecteur.cible = -1;
    sauverLecteur(); rendreLecteur();
  }
  const prec = () => { if (iChap > 0) aller(iLivre, iChap - 1); else aller(iLivre - 1, -1); };
  const suiv = () => { if (iChap < livre.chapitres.length - 1) aller(iLivre, iChap + 1); else aller(iLivre + 1, 0); };
  const selLivre = el("select", null, BIBLE.livres.map((l, i) => el("option", { value: String(i) }, l.nom)));
  selLivre.value = String(iLivre);
  selLivre.onchange = () => aller(Number(selLivre.value), 0);
  const selChap = el("select", null, livre.chapitres.map((c, i) => el("option", { value: String(i) }, String(c.n))));
  selChap.value = String(iChap);
  selChap.onchange = () => aller(iLivre, Number(selChap.value));
  const texte = el("div", { className: "texte-bible", style: "font-size:" + (Number(prefs.taille) || 19) + "px" });
  for (const [n, t] of ch.versets) {
    const coul = etat.surlignages[livre.nom + "|" + ch.n + "|" + n];
    texte.append(el("span", { className: "verset" + (coul ? " c-" + coul : ""), id: "v-" + n, onclick: () => menuVerset(livre.nom, ch.n, n, t) }, el("sup", null, String(n)), t), " ");
  }
  zone.replaceChildren(
    el("div", { className: "rangee" }, selLivre, selChap, bouton("A\u2212", () => changerTaille(-1), "petit secondaire"), bouton("A+", () => changerTaille(1), "petit secondaire")),
    el("h3", null, livre.nom + " " + ch.n),
    texte,
    el("div", { className: "rangee", style: "justify-content:space-between;margin-top:12px" },
      bouton("\u25C0 Pr\u00e9c\u00e9dent", prec, "petit secondaire"), bouton("Suivant \u25B6", suiv, "petit secondaire")));
  if (lecteur.cible) {
    const versetCible = lecteur.cible > 0 ? $("v-" + lecteur.cible) : null;
    const cible = versetCible || zone;
    if (versetCible) versetCible.classList.add("choisi");
    lecteur.cible = 0;
    setTimeout(() => cible.scrollIntoView({ behavior: "smooth", block: versetCible ? "center" : "start" }), 60);
  }
}
function menuVerset(nomLivre, c, v, t) {
  const ref = nomLivre + " " + c + ", " + v;

function depot() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;

  return { user: h.replace(".github.io", ""), repo: p[0] || h };
}
async function aelf(type, date, zone) {

    urls.push("https://raw.githubusercontent.com/" + d.user + "/" + d.repo + "/main/" + nom);
    urls.push("https://raw.githubusercontent.com/" + d.user + "/" + d.repo + "/master/" + nom);
    urls.push("https://cdn.jsdelivr.net/gh/" + d.user + "/" + d.repo + "@main/" + nom);
  }
  urls.push("https://api.aelf.org/v1/" + type + "/" + date + "/" + zone);
  for (const u of urls) {
    try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {}

}

  const actions = ["Pose ton t\u00e9l\u00e9phone dans une autre pi\u00e8ce", "Sors marcher 10 minutes", "Bois un grand verre d'eau",
    "Fais 20 pompes ou 30 squats", "Prends une douche fra\u00eeche", "Va l\u00e0 o\u00f9 il y a du monde", "Allume la lumi\u00e8re, ouvre une fen\u00eatre"];
  ouvrirModale(
    el("h2", null, "Tu n'es pas seul"),

    chrono, cercle, consigne,
    el("details", { className: "carte" }, el("summary", null, "\u{1F64F} Prier"),
      el("p", null, el("strong", null, "J\u00e9sus, Fils de David, aie piti\u00e9 de moi, p\u00e9cheur.")),

      : el("div", { className: "carte" }, el("p", { className: "texte-bible" }, "Dieu est fid\u00e8le : il ne permettra pas que tu sois tent\u00e9 au-del\u00e0 de tes forces."), el("p", { className: "doux" }, "\u2014 d'apr\u00e8s 1 Corinthiens 10, 13")),
    el("details", { className: "carte" }, el("summary", null, "\u{1F3C3} Agir maintenant"), el("ul", null, actions.map(a => el("li", null, a)))),
    R.lettre ? el("details", { className: "carte", open: true }, el("summary", null, "\u{1F48C} Ta lettre"), el("p", { style: "white-space:pre-wrap" }, R.lettre)) : null,
    contacts.length
      ? el("div", { className: "carte" }, el("h3", null, "Appelle quelqu'un"), contacts)
      : el("p", { className: "doux" }, "Astuce : ajoute 2 contacts de confiance dans l'onglet Libert\u00e9."),
    el("div", { className: "rangee" },
      bouton("\u{1F64C} J'ai tenu !", () => noterTentation({ issue: "tenu" })),
      bouton("Je suis tomb\u00e9", () => pageChute(false), "secondaire")));
  setTimeout(tic, 60);
  const minuteur = setInterval(tic, 1000);

}

function carteOffrande(r) {
  if (r.offrande != null) return el("div", { className: "carte" },
    el("p", null, "\u2705 Journ\u00e9e offerte" + (r.offrande ? " \u2014 intention : " + r.offrande : "")),
    bouton("Relire la pri\u00e8re", () => ouvrirModale(el("h3", null, "Offrande du matin"), el("p", { className: "lecture-texte" }, OFFRANDE)), "petit secondaire"));
  const intention = el("input", { placeholder: "Mon intention pour aujourd'hui (facultatif)" });
  return el("div", { className: "carte" },
    el("p", { className: "lecture-texte" }, OFFRANDE),
    intention,
    bouton("J'offre ma journ\u00e9e", () => { jourRituel().offrande = intention.value.trim(); sauver(); rendreRituels(); toast("Que ta journ\u00e9e soit b\u00e9nie \u{1F64F}"); }));
}
function carteExamen(r) {
  const ex = r.examen && typeof r.examen === "object" ? r.examen : null;
  if (ex && !examenOuvert) return el("div", { className: "carte" },
    el("p", null, "\u2705 Examen fait."),
    ex.merci ? el("p", { className: "doux" }, "Merci : " + ex.merci) : null,
    bouton("Modifier", () => { examenOuvert = true; rendreRituels(); }, "petit secondaire"));
  const champs = {};
  const carte = el("div", { className: "carte" }, el("p", { className: "doux" }, "Quelques minutes avec Dieu pour relire ta journ\u00e9e, avec saint Ignace."));
  for (const [k, titre, q] of ETAPES_EXAMEN) {
    champs[k] = el("textarea", { placeholder: q, value: (ex && ex[k]) || "", style: "min-height:60px" });
    carte.append(el("h3", null, titre), champs[k]);
  }
  carte.append(bouton("Terminer par un Notre P\u00e8re \u{1F64F}", () => {
    const o = { quand: Date.now() };
    for (const k in champs) o[k] = champs[k].value.trim();
    jourRituel().examen = o; examenOuvert = false; sauver();
    ouvrirModale(el("h3", null, "Notre P\u00e8re"), el("p", { className: "lecture-texte" }, NOTRE_PERE), bouton("Amen", () => { fermerModale(); rendreRituels(); }));
  }));
  return carte;
}
function blocDizaine() {
  const zone = el("div");
  const d = new Date();
  const serie = SERIE_JOUR[d.getDay()];
  const mystere = MYSTERES[serie][d.getDate() % 5];
  const etapes = [["Notre P\u00e8re", NOTRE_PERE]];
  for (let i = 1; i <= 10; i++) etapes.push(["Je vous salue Marie (" + i + "/10)", AVE]);
  etapes.push(["Gloire au P\u00e8re", GLOIRE]);
  function maj() {
    if (dizaine >= etapes.length) {
      zone.replaceChildren(el("div", { className: "carte centre" }, el("p", null, "\u2705 Dizaine pri\u00e9e. Marie te garde."), bouton("Recommencer", () => { dizaine = 0; maj(); }, "petit secondaire")));
      return;
    }
    const [titre, texte] = etapes[dizaine];
    zone.replaceChildren(el("div", { className: "carte" },
      el("p", null, el("strong", null, "Myst\u00e8res " + serie + " : "), mystere),
      el("div", { className: "perles" }, Array.from({ length: 10 }, (_, i) => el("i", { className: dizaine > i + 1 ? "faite" : "" }))),
      el("h3", null, titre),
      el("p", { className: "lecture-texte" }, texte),
      bouton(dizaine === etapes.length - 1 ? "Amen" : "Suivant", () => {
        dizaine++;
        if (dizaine >= etapes.length) { jourRituel().dizaine = true; sauver(); }
        maj();
      })));
  }
  maj();
  return zone;
}
function carteCouvreFeu() {
  const cb = el("input", { type: "checkbox", checked: !!prefs.couvreFeu, style: "width:auto;margin-right:10px" });
  cb.onchange = () => { prefs.couvreFeu = cb.checked; sauverPrefs(); };
  return el("div", { className: "carte" },
    el("label", null, cb, "Activer le couvre-feu de 23 h \u00e0 6 h"),
    el("p", { className: "doux" }, "La nuit, l'appli t'invite \u00e0 poser ton t\u00e9l\u00e9phone. Astuce : recharge-le hors de ta chambre."));
}
function semaineRituels() {
  const lignes = [];
  for (let i = 6; i >= 0; i--) {
    const k = decaler(iso(), -i);
    const r = etat.rituels[k] || {};
    const [a, m, j] = k.split("-").map(Number);
    lignes.push(el("div", { className: "rangee", style: "justify-content:space-between" },
      el("span", null, JOURS[new Date(a, m - 1, j).getDay()].slice(0, 3) + " " + j),
      el("span", null, (r.offrande != null ? "\u2600\uFE0F" : "\u00b7") + "  " + (r.examen ? "\u{1F319}" : "\u00b7") + "  " + (r.dizaine ? "\u{1F4FF}" : "\u00b7"))));
  }
  return el("div", { className: "carte" }, lignes, el("p", { className: "doux" }, "\u2600\uFE0F offrande \u00b7 \u{1F319} examen \u00b7 \u{1F4FF} dizaine"));
}
function rendreRituels() {
  const r = etat.rituels[iso()] || {};
  $("vue-rituels").replaceChildren(
    el("h2", null, "\u2600\uFE0F Offrande du matin"), carteOffrande(r),
    el("h2", null, "\u{1F319} Examen du soir"), carteExamen(r),
    el("h2", null, "\u{1F4FF} Une dizaine"), blocDizaine(),
    el("h2", null, "\u{1F6CC} Couvre-feu num\u00e9rique"), carteCouvreFeu(),
    el("h2", null, "Ma semaine"), semaineRituels());
}

/* ---------- Couvre-feu ---------- */
function enCouvreFeu() {
  if (!prefs.couvreFeu) return false;
  if (Date.now() < (Number(prefs.couvreFeuPause) || 0)) return false;
  const h = new Date().getHours();
  return h >= 23 || h < 6;
}
function verifierCouvreFeu() {
  const c = $("couvre-feu");
  if (!enCouvreFeu()) { c.hidden = true; return; }
  if (!c.hidden) return;
  const pause = min => { prefs.couvreFeuPause = Date.now() + min * 60000; sauverPrefs(); c.hidden = true; };
  c.className = "couvre-feu";
  c.replaceChildren(
    el("div", { style: "font-size:48px" }, "\u{1F319}"),
    el("h2", { style: "color:#e0b48a" }, "C'est l'heure du repos"),
    el("p", null, "Couvre-feu de 23 h \u00e0 6 h. Pose ton t\u00e9l\u00e9phone loin de ton lit et remets ta nuit \u00e0 Dieu."),
    el("p", { style: "font-style:italic" }, "\u00ab Entre tes mains, Seigneur, je remets mon esprit. \u00bb"),
    bouton("Faire mon examen du soir", () => { pause(15); vue("rituels"); }),
    bouton("\u{1F198} J'ai besoin d'aide", () => { pause(20); ouvrirSOS(); }, "danger"),
    bouton("Continuer 5 minutes", () => pause(5), "secondaire"));
  c.hidden = false;
}

/* ---------- Navigation ---------- */
const VUES = ["parole", "fil", "liberte", "rituels"];
let vueActive = "parole";
let deverrouille = false;
function vue(nom) {
  if (vueActive === "liberte" && nom !== "liberte") deverrouille = false;
  vueActive = nom;
  for (const v of VUES) { $("vue-" + v).hidden = v !== nom; $("nav-" + v).classList.toggle("actif", v === nom); }
  if (nom === "fil") rendreFil();
  if (nom === "liberte") rendreLiberte();
  if (nom === "rituels") rendreRituels();
  window.scrollTo(0, 0);
}

/* ---------- Fenetre modale ---------- */
let nettoyageModale = null;
function ouvrirModale(...contenu) {
  if (nettoyageModale) { nettoyageModale(); nettoyageModale = null; }
  $("modale").replaceChildren(el("div", { className: "boite" }, bouton("\u2715", fermerModale, "secondaire petit fermer"), ...contenu));
  $("modale").hidden = false;
  $("modale").scrollTop = 0;
}
function fermerModale() {
  if (nettoyageModale) { nettoyageModale(); nettoyageModale = null; }
  $("modale").hidden = true;
  $("modale").replaceChildren();
}

/* ---------- Reglages generaux ---------- */
function exporter() {
  const txt = JSON.stringify(etat, null, 1);
  const nom = "bible-journal-" + iso() + ".json";
  try {
    const f = new File([txt], nom, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: nom }).catch(() => {}); return; }
  } catch (e) {}
  const a = el("a", { href: URL.createObjectURL(new Blob([txt], { type: "application/json" })), download: nom });
  document.body.append(a); a.click(); a.remove();
}
async function recupererAncien() {
  const j = await chercherAncienJournal();
  if (!j) { alert("Aucune donn\u00e9e d'une ancienne version trouv\u00e9e sur ce t\u00e9l\u00e9phone."); return; }
  if (!confirm("Donn\u00e9es trouv\u00e9es (" + liste(j.entrees).length + " notes de journal). Les r\u00e9cup\u00e9rer ? Cela remplace les donn\u00e9es actuelles.")) return;
  etat = completer(j);
  await ecrire("journal", etat);
  location.reload();
}
function ouvrirReglages() {
  const zones = [["france", "France"], ["belgique", "Belgique"], ["canada", "Canada"], ["afrique", "Afrique"], ["romain", "Calendrier romain"]];
  const zone = el("select", null, zones.map(([v, t]) => el("option", { value: v }, t)));
  zone.value = prefs.zone;
  zone.onchange = () => { prefs.zone = zone.value; sauverPrefs(); rendreLectures(); };
  const fichier = el("input", { type: "file", accept: ".json,application/json" });
  fichier.onchange = async () => {
    const f = fichier.files[0];
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!confirm("Remplacer toutes tes donn\u00e9es actuelles par cette sauvegarde ?")) return;
      etat = completer(j);
      await ecrire("journal", etat);
      location.reload();
    } catch (e) { alert("Fichier illisible : " + e.message); }
  };
  ouvrirModale(
    el("h2", null, "R\u00e9glages"),
    el("h3", null, "Calendrier des lectures (AELF)"), zone,
    el("h3", null, "Taille du texte biblique"),
    el("div", { className: "rangee" }, bouton("A\u2212", () => changerTaille(-1), "petit secondaire"), bouton("A+", () => changerTaille(1), "petit secondaire")),
    el("h3", null, "Sauvegarde"),
    el("p", { className: "doux" }, "Tes donn\u00e9es restent sur ce t\u00e9l\u00e9phone. Fais une sauvegarde de temps en temps."),
    bouton("Exporter mes donn\u00e9es", exporter, "petit"),
    el("p", { className: "doux" }, "Restaurer une sauvegarde :"), fichier,
    el("h3", null, "Ancienne version"),
    bouton("R\u00e9cup\u00e9rer mes anciennes donn\u00e9es", recupererAncien, "petit secondaire"),
    el("h3", null, "Bible"),
    bouton("Ret\u00e9l\u00e9charger la Bible", async () => {
      await ecrire("bible-crampon", null); BIBLE = null; promesseBible = null; fermerModale(); rendreLecteur();
    }, "petit secondaire"));
}

/* ---------- Demarrage ---------- */
async function demarrer() {
  for (const v of VUES) $("nav-" + v).onclick = () => vue(v);
  $("btn-sos").onclick = ouvrirSOS;
  $("btn-reglages").onclick = ouvrirReglages;
  let j = null;
  try {
    j = await lire("journal");
    if (!j) {
      j = await chercherAncienJournal();
      if (j) toast("Anciennes donn\u00e9es r\u00e9cup\u00e9r\u00e9es \u2714");
    }
  } catch (e) { toast("Base de donn\u00e9es : " + e.message); }
  etat = completer(j);
  sauver();
  construireParole();
  vue("parole");
  rendreParole();
  verifierCouvreFeu();
  setInterval(verifierCouvreFeu, 60000);
}
demarrer();
</script>
</body>
</html>
